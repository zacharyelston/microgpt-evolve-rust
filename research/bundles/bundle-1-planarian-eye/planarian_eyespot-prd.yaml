apiVersion: microgpt.evolve/v1alpha1
kind: Bundle
metadata:
  name: planarian_eyespot_v1
  version: "1.0.0"
  category: vision/layer_0_retina/directional_eyespot
  author: bio_architect
  description: "A primitive directional light sensor. Uses an 8x8 quantized grayscale grid to determine light source direction."

# The Core 'Brain' of the Eyespot
architecture:
  evaluator_core:
    n_emb: 16
    n_ctx: 4           # Only needs to look at the 4 upstream quadrant embeddings
    n_layer: 1
    n_head: 4
    n_ff_exp: 4
  
  plasticity:
    l1_prune_penalty: 0.01
    prune_threshold: 0.05
    max_surviving_synapses: 4 # It shouldn't need more than the 4 quadrants

interface:
  input_type: "8x8_quantized_grayscale_array" # Values 0-9
  output_type: "probability_vector"
  output_dim: 5 # [Light_Left, Light_Right, Light_Top, Light_Bottom, Uniform]

# The "Receptive Fields" (The 4 Quadrants of the 8x8 grid)
# Each of these is a tiny, hyper-fast MicroGPT looking at 16 pixels (4x4)
upstream_nodes:
  binding_strategy: static_allocation
  nodes:
    top_left_quadrant:
      path: "genomes/vision/layer_0_retina/patches/top_left_latest.json"
      n_ctx: 16
      slice: [0, 4, 0, 4] # [x_start, x_end, y_start, y_end]
      
    top_right_quadrant:
      path: "genomes/vision/layer_0_retina/patches/top_right_latest.json"
      n_ctx: 16
      slice: [4, 8, 0, 4]
      
    bottom_left_quadrant:
      path: "genomes/vision/layer_0_retina/patches/bottom_left_latest.json"
      n_ctx: 16
      slice: [0, 4, 4, 8]
      
    bottom_right_quadrant:
      path: "genomes/vision/layer_0_retina/patches/bottom_right_latest.json"
      n_ctx: 16
      slice: [4, 8, 4, 8]

---
# Next Steps for Implementation:
1. Generate the Synthetic Dataset
You will need a simple Python or Rust script to generate eyespot_training.txt.
Because your current tokenizer maps characters to tokens, you can represent the 0-9 brightness values directly as ASCII digits (0123456789), and the targets as specific characters (e.g., L for Left, R for Right, T for Top, B for Bottom, U for Uniform).

A single line of training data for "Light on Top" would look like a 64-character string of bright pixels followed by dark pixels, terminated by the label:
9989988998998899554554455455445511011001101100110000000000000000T

2. Bootstrapping the Quadrants
Since this is Layer 0, the 4 upstream_nodes don't exist yet. Your Rust engine should read this YAML and realize: "I need to initialize four fresh, blank MicroGPTs with n_ctx=16 and train them simultaneously alongside the Evaluator."

This gives you a rapid, testable loop. You can pass 10,000 synthetic lines through this bundle, watch the loss drop, and then immediately test it by typing in your own 64-character strings to see if the network correctly predicts the gradient direction.