name: Build and Push Docker Image

on:
  push:
    branches: [main, master, 'feature/**']
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Dockerfile'
      - 'scripts/**'
      - 'evolution_config.json'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tags
        id: tags
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          BRANCH_TAG=$(echo "$BRANCH" | sed 's|/|-|g' | sed 's|[^a-zA-Z0-9._-]|-|g')
          TAGS="ghcr.io/zacharyelston/microgpt-evolve-rust:${BRANCH_TAG}"
          TAGS="${TAGS},ghcr.io/zacharyelston/microgpt-evolve-rust:${{ github.sha }}"
          if [[ "$BRANCH" == "main" || "$BRANCH" == "master" ]]; then
            TAGS="${TAGS},ghcr.io/zacharyelston/microgpt-evolve-rust:latest"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "branch_tag=${BRANCH_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
