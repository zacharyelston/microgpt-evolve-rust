apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: microgpt-evolve-
  namespace: apollo-cv
spec:
  workflowTemplateRef:
    name: microgpt-evolve
  arguments:
    parameters:
      - name: generations
        value: "50"
      - name: population-size
        value: "32"
      - name: target-loss
        value: "1.1"
      - name: image
        value: "ghcr.io/zacharyelston/microgpt-evolve-rust:feature-larger-runs"
