apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: microgpt-evolve
  namespace: apollo-cv
spec:
  serviceAccountName: apollo-cv-workflow
  entrypoint: evolution-pipeline
  volumeClaimTemplates:
    - metadata:
        name: results
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
  arguments:
    parameters:
      - name: generations
        value: "20"
      - name: population-size
        value: "12"
      - name: target-loss
        value: "1.2"
      - name: image
        value: "ghcr.io/zacharyelston/microgpt-evolve-rust:latest"

  templates:
    - name: evolution-pipeline
      inputs:
        parameters:
          - name: generations
          - name: population-size
          - name: target-loss
          - name: image
      outputs:
        parameters:
          - name: best-loss
            valueFrom:
              parameter: "{{steps.register.outputs.parameters.genome-loss}}"
          - name: best-genome-config
            valueFrom:
              parameter: "{{steps.register.outputs.parameters.genome-config}}"
          - name: summary
            valueFrom:
              parameter: "{{steps.analyze.outputs.parameters.summary}}"
      steps:
        - - name: detect-gpu
            template: detect-gpu
            arguments:
              parameters:
                - name: image
                  value: "{{inputs.parameters.image}}"

        - - name: evolve
            template: run-evolution
            arguments:
              parameters:
                - name: generations
                  value: "{{inputs.parameters.generations}}"
                - name: population-size
                  value: "{{inputs.parameters.population-size}}"
                - name: target-loss
                  value: "{{inputs.parameters.target-loss}}"
                - name: image
                  value: "{{inputs.parameters.image}}"
                - name: gpu-name
                  value: "{{steps.detect-gpu.outputs.parameters.gpu-name}}"
                - name: node-name
                  value: "{{steps.detect-gpu.outputs.parameters.node-name}}"

        - - name: register
            template: register-genome
            arguments:
              parameters:
                - name: image
                  value: "{{inputs.parameters.image}}"
                - name: run-id
                  value: "{{workflow.name}}"
                - name: evolved-loss
                  value: "{{steps.evolve.outputs.parameters.best-loss}}"
                - name: node-name
                  value: "{{steps.detect-gpu.outputs.parameters.node-name}}"

        - - name: analyze
            template: analyze-results
            arguments:
              parameters:
                - name: image
                  value: "{{inputs.parameters.image}}"
                - name: generations
                  value: "{{inputs.parameters.generations}}"
                - name: population-size
                  value: "{{inputs.parameters.population-size}}"
                - name: best-loss
                  value: "{{steps.evolve.outputs.parameters.best-loss}}"
                - name: best-genome-config
                  value: "{{steps.register.outputs.parameters.genome-config}}"

    # ─── detect-gpu ──────────────────────────────────────────────────────────
    - name: detect-gpu
      inputs:
        parameters:
          - name: image
      outputs:
        parameters:
          - name: gpu-name
            valueFrom:
              path: /tmp/gpu-name.txt
              default: "unknown"
          - name: node-name
            valueFrom:
              path: /tmp/node-name.txt
              default: "unknown"
      podSpecPatch: |
        runtimeClassName: nvidia
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    workflows.argoproj.io/workflow: "{{workflow.name}}"
                topologyKey: kubernetes.io/hostname
      container:
        image: "{{inputs.parameters.image}}"
        command: [sh, -c]
        args:
          - /app/gpu_detect 2>&1 | tee /tmp/gpu-detect.txt; grep -oP 'GPU.*:\s*\K.+' /tmp/gpu-detect.txt | head -1 > /tmp/gpu-name.txt || echo "GPU detected" > /tmp/gpu-name.txt; echo "${NODE_NAME:-unknown}" > /tmp/node-name.txt
        env:
          - name: NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
        resources:
          requests:
            nvidia.com/gpu: "1"
          limits:
            nvidia.com/gpu: "1"

    # ─── run-evolution ────────────────────────────────────────────────────────
    - name: run-evolution
      inputs:
        parameters:
          - name: generations
          - name: population-size
          - name: target-loss
          - name: image
          - name: gpu-name
          - name: node-name
      outputs:
        parameters:
          - name: best-loss
            valueFrom:
              path: /tmp/best-loss.txt
              default: "N/A"
      podSpecPatch: |
        runtimeClassName: nvidia
      container:
        image: "{{inputs.parameters.image}}"
        command: [python3]
        args:
          - /app/scripts/workflow_run_evolution.py
          - --generations
          - "{{inputs.parameters.generations}}"
          - --population-size
          - "{{inputs.parameters.population-size}}"
          - --target-loss
          - "{{inputs.parameters.target-loss}}"
          - --output-dir
          - /results
        resources:
          requests:
            nvidia.com/gpu: "1"
          limits:
            nvidia.com/gpu: "1"
        volumeMounts:
          - name: results
            mountPath: /results

    # ─── register-genome ──────────────────────────────────────────────────────
    - name: register-genome
      inputs:
        parameters:
          - name: image
          - name: run-id
          - name: evolved-loss
          - name: node-name
      outputs:
        parameters:
          - name: genome-loss
            valueFrom:
              path: /tmp/genome-loss.txt
              default: "N/A"
          - name: genome-config
            valueFrom:
              path: /tmp/genome-config.txt
              default: "unknown"
          - name: next-genesis
            valueFrom:
              path: /tmp/next-genesis.json
              default: "{}"
      container:
        image: "{{inputs.parameters.image}}"
        command: [python3]
        args:
          - /app/scripts/workflow_register_genome.py
          - --genome
          - /results/genome-best.json
          - --config
          - /app/evolution_config.json
          - --run-id
          - "{{inputs.parameters.run-id}}"
          - --output-dir
          - /tmp
        env:
          - name: EVOLVE_NODE_NAME
            value: "{{inputs.parameters.node-name}}"
        volumeMounts:
          - name: results
            mountPath: /results

    # ─── analyze-results ──────────────────────────────────────────────────────
    - name: analyze-results
      inputs:
        parameters:
          - name: image
          - name: generations
          - name: population-size
          - name: best-loss
          - name: best-genome-config
      outputs:
        parameters:
          - name: summary
            valueFrom:
              path: /tmp/summary.txt
              default: "No results"
          - name: best-loss
            valueFrom:
              path: /tmp/best-loss.txt
              default: "N/A"
      container:
        image: "{{inputs.parameters.image}}"
        command: [python3]
        args:
          - /app/scripts/workflow_analyze.py
          - --log
          - /results/evolve.log
          - --output-dir
          - /tmp
        volumeMounts:
          - name: results
            mountPath: /results
