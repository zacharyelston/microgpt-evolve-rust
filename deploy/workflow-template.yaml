apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: microgpt-evolve
  namespace: apollo-cv
spec:
  serviceAccountName: apollo-cv-workflow
  entrypoint: island-evolution-pipeline
  arguments:
    parameters:
      - name: generations
        value: "50"
      - name: population-size
        value: "32"
      - name: target-loss
        value: "1.1"
      - name: image
        value: "ghcr.io/zacharyelston/microgpt-evolve-rust:feature-larger-runs"

  templates:

    # ─── top-level pipeline ───────────────────────────────────────────────────
    - name: island-evolution-pipeline
      inputs:
        parameters:
          - name: generations
          - name: population-size
          - name: target-loss
          - name: image
      outputs:
        parameters:
          - name: best-loss
            valueFrom:
              parameter: "{{steps.register.outputs.parameters.genome-loss}}"
          - name: best-genome-config
            valueFrom:
              parameter: "{{steps.register.outputs.parameters.genome-config}}"
          - name: island-summary
            valueFrom:
              parameter: "{{steps.merge.outputs.parameters.island-summary}}"
      steps:
        # Step 1 — all 4 islands run in parallel, each pinned to its own node
        - - name: island-hh-b01
            template: island
            arguments:
              parameters:
                - name: image
                  value: "{{inputs.parameters.image}}"
                - name: generations
                  value: "{{inputs.parameters.generations}}"
                - name: population-size
                  value: "{{inputs.parameters.population-size}}"
                - name: target-loss
                  value: "{{inputs.parameters.target-loss}}"
                - name: node
                  value: "hh-b01.hydra.anceralabs.com"
          - name: island-hh-b02
            template: island
            arguments:
              parameters:
                - name: image
                  value: "{{inputs.parameters.image}}"
                - name: generations
                  value: "{{inputs.parameters.generations}}"
                - name: population-size
                  value: "{{inputs.parameters.population-size}}"
                - name: target-loss
                  value: "{{inputs.parameters.target-loss}}"
                - name: node
                  value: "hh-b02.hydra.anceralabs.com"
          - name: island-hh-b03
            template: island
            arguments:
              parameters:
                - name: image
                  value: "{{inputs.parameters.image}}"
                - name: generations
                  value: "{{inputs.parameters.generations}}"
                - name: population-size
                  value: "{{inputs.parameters.population-size}}"
                - name: target-loss
                  value: "{{inputs.parameters.target-loss}}"
                - name: node
                  value: "hh-b03.hydra.anceralabs.com"
          - name: island-hh-b05
            template: island
            arguments:
              parameters:
                - name: image
                  value: "{{inputs.parameters.image}}"
                - name: generations
                  value: "{{inputs.parameters.generations}}"
                - name: population-size
                  value: "{{inputs.parameters.population-size}}"
                - name: target-loss
                  value: "{{inputs.parameters.target-loss}}"
                - name: node
                  value: "hh-b05.hydra.anceralabs.com"

        # Step 2 — merge: pick the winning island (lowest loss)
        - - name: merge
            template: merge-islands
            arguments:
              parameters:
                - name: image
                  value: "{{inputs.parameters.image}}"
                - name: losses
                  value: "{{steps.island-hh-b01.outputs.parameters.best-loss}},{{steps.island-hh-b02.outputs.parameters.best-loss}},{{steps.island-hh-b03.outputs.parameters.best-loss}},{{steps.island-hh-b05.outputs.parameters.best-loss}}"
                - name: nodes
                  value: "hh-b01.hydra.anceralabs.com,hh-b02.hydra.anceralabs.com,hh-b03.hydra.anceralabs.com,hh-b05.hydra.anceralabs.com"
                - name: genome-b01
                  value: "{{steps.island-hh-b01.outputs.parameters.best-genome-json}}"
                - name: genome-b02
                  value: "{{steps.island-hh-b02.outputs.parameters.best-genome-json}}"
                - name: genome-b03
                  value: "{{steps.island-hh-b03.outputs.parameters.best-genome-json}}"
                - name: genome-b05
                  value: "{{steps.island-hh-b05.outputs.parameters.best-genome-json}}"

        # Step 3 — register: update genesis config for next cron cycle
        - - name: register
            template: register-genome
            arguments:
              parameters:
                - name: image
                  value: "{{inputs.parameters.image}}"
                - name: run-id
                  value: "{{workflow.name}}"
                - name: best-genome-json
                  value: "{{steps.merge.outputs.parameters.best-genome-json}}"
                - name: best-loss
                  value: "{{steps.merge.outputs.parameters.best-loss}}"
                - name: best-node
                  value: "{{steps.merge.outputs.parameters.best-node}}"

        # Step 4 — analyze: human-readable summary
        - - name: analyze
            template: analyze-results
            arguments:
              parameters:
                - name: image
                  value: "{{inputs.parameters.image}}"
                - name: generations
                  value: "{{inputs.parameters.generations}}"
                - name: best-loss
                  value: "{{steps.merge.outputs.parameters.best-loss}}"
                - name: best-node
                  value: "{{steps.merge.outputs.parameters.best-node}}"
                - name: island-summary
                  value: "{{steps.merge.outputs.parameters.island-summary}}"
                - name: best-genome-config
                  value: "{{steps.register.outputs.parameters.genome-config}}"

    # ─── island: one GPU evolution run pinned to a specific node ─────────────
    - name: island
      inputs:
        parameters:
          - name: image
          - name: generations
          - name: population-size
          - name: target-loss
          - name: node
      outputs:
        parameters:
          - name: best-loss
            valueFrom:
              path: /tmp/best-loss.txt
              default: "99.0"
          - name: best-genome-json
            valueFrom:
              path: /tmp/genome-best.json
              default: "{\"loss\":99.0}"
      retryStrategy:
        limit: "1"
        retryPolicy: OnError
      podSpecPatch: |
        runtimeClassName: nvidia
      nodeSelector:
        kubernetes.io/hostname: "{{inputs.parameters.node}}"
      container:
        image: "{{inputs.parameters.image}}"
        command: [sh, -c]
        args:
          - |
            python3 /app/scripts/workflow_run_evolution.py \
              --generations {{inputs.parameters.generations}} \
              --population-size {{inputs.parameters.population-size}} \
              --target-loss {{inputs.parameters.target-loss}} \
              --output-dir /tmp
            if [ ! -f /tmp/genome-best.json ] && [ -f /tmp/genome.json ]; then
              cp /tmp/genome.json /tmp/genome-best.json
              echo "[island] genome.json → genome-best.json"
            fi
            if [ ! -f /tmp/genome-best.json ]; then
              echo '{"loss":99.0}' > /tmp/genome-best.json
            fi
        env:
          - name: NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
        resources:
          requests:
            nvidia.com/gpu: "1"
          limits:
            nvidia.com/gpu: "1"

    # ─── merge-islands: pick winning genome across all islands ────────────────
    - name: merge-islands
      inputs:
        parameters:
          - name: image
          - name: losses
          - name: nodes
          - name: genome-b01
          - name: genome-b02
          - name: genome-b03
          - name: genome-b05
      outputs:
        parameters:
          - name: best-loss
            valueFrom:
              path: /tmp/best-loss.txt
              default: "N/A"
          - name: best-node
            valueFrom:
              path: /tmp/best-node.txt
              default: "unknown"
          - name: island-summary
            valueFrom:
              path: /tmp/island-summary.txt
              default: "No results"
          - name: best-genome-json
            valueFrom:
              path: /tmp/best-genome.json
              default: "{}"
      container:
        image: "{{inputs.parameters.image}}"
        command: [sh, -c]
        args:
          - |
            echo '{{inputs.parameters.genome-b01}}' > /tmp/island-0.json
            echo '{{inputs.parameters.genome-b02}}' > /tmp/island-1.json
            echo '{{inputs.parameters.genome-b03}}' > /tmp/island-2.json
            echo '{{inputs.parameters.genome-b05}}' > /tmp/island-3.json
            SCRIPT=/app/scripts/workflow_merge_islands.py
            if [ -f "$SCRIPT" ]; then
              python3 "$SCRIPT" \
                --losses "{{inputs.parameters.losses}}" \
                --genomes "/tmp/island-0.json,/tmp/island-1.json,/tmp/island-2.json,/tmp/island-3.json" \
                --nodes "{{inputs.parameters.nodes}}" \
                --output-dir /tmp
            else
              python3 - <<'PYEOF'
            import json
            losses = [s.strip() for s in "{{inputs.parameters.losses}}".split(",")]
            nodes  = [s.strip() for s in "{{inputs.parameters.nodes}}".split(",")]
            files  = ["/tmp/island-0.json","/tmp/island-1.json","/tmp/island-2.json","/tmp/island-3.json"]
            best_loss, best_node, best_genome = float("inf"), "none", {}
            lines = []
            for i,(ls,nd,gf) in enumerate(zip(losses,nodes,files)):
                try: loss = float(ls)
                except: loss = float("inf")
                try: genome = json.loads(open(gf).read())
                except: genome = {}
                marker = ""
                if loss < best_loss and genome:
                    best_loss, best_node, best_genome = loss, nd, genome
                    marker = " <-- WINNER"
                lines.append(f"  [{i}] {nd}: loss={loss:.6f}{marker}")
                print(f"[merge] island {i} {nd}: loss={loss:.6f}")
            summary = "=== Island Merge ===\n" + "\n".join(lines) + f"\nBest: {best_loss:.6f} on {best_node}"
            print(summary)
            open("/tmp/best-loss.txt","w").write(str(best_loss)+"\n")
            open("/tmp/best-node.txt","w").write(best_node+"\n")
            open("/tmp/island-summary.txt","w").write(summary+"\n")
            open("/tmp/best-genome.json","w").write(json.dumps(best_genome,indent=2)+"\n")
            PYEOF
            fi

    # ─── register-genome: update next-run genesis from winning genome ─────────
    - name: register-genome
      inputs:
        parameters:
          - name: image
          - name: run-id
          - name: best-genome-json
          - name: best-loss
          - name: best-node
      outputs:
        parameters:
          - name: genome-loss
            valueFrom:
              path: /tmp/genome-loss.txt
              default: "N/A"
          - name: genome-config
            valueFrom:
              path: /tmp/genome-config.txt
              default: "unknown"
      container:
        image: "{{inputs.parameters.image}}"
        command: [sh, -c]
        args:
          - |
            echo '{{inputs.parameters.best-genome-json}}' > /tmp/genome-best.json
            LOSS=$(python3 -c "import json,sys; d=json.load(open('/tmp/genome-best.json')); print(d.get('loss',99.0))" 2>/dev/null || echo "99.0")
            echo "[register] genome loss check: $LOSS"
            python3 -c "
            import sys
            try:
                loss = float('$LOSS')
            except:
                loss = 99.0
            if loss >= 90.0:
                print('[register] Fallback genome — skipping registration, writing safe outputs')
                open('/tmp/genome-loss.txt','w').write(str(loss)+'\n')
                open('/tmp/genome-config.txt','w').write('fallback — no valid genome\n')
                sys.exit(0)
            sys.exit(1)
            " && exit 0
            python3 /app/scripts/workflow_register_genome.py \
              --genome /tmp/genome-best.json \
              --config /app/evolution_config.json \
              --run-id "{{inputs.parameters.run-id}}" \
              --output-dir /tmp
        env:
          - name: EVOLVE_NODE_NAME
            value: "{{inputs.parameters.best-node}}"

    # ─── analyze-results: human-readable summary ──────────────────────────────
    - name: analyze-results
      inputs:
        parameters:
          - name: image
          - name: generations
          - name: best-loss
          - name: best-node
          - name: island-summary
          - name: best-genome-config
      outputs:
        parameters:
          - name: summary
            valueFrom:
              path: /tmp/summary.txt
              default: "No results"
      container:
        image: "{{inputs.parameters.image}}"
        command: [sh, -c]
        args:
          - |
            printf "=== MicroGPT Island Evolution ===\n" > /tmp/summary.txt
            printf "Generations per island: {{inputs.parameters.generations}}\n" >> /tmp/summary.txt
            printf "Best loss:              {{inputs.parameters.best-loss}}\n" >> /tmp/summary.txt
            printf "Best node:              {{inputs.parameters.best-node}}\n" >> /tmp/summary.txt
            printf "Best genome:            {{inputs.parameters.best-genome-config}}\n" >> /tmp/summary.txt
            printf "\n{{inputs.parameters.island-summary}}\n" >> /tmp/summary.txt
            cat /tmp/summary.txt
